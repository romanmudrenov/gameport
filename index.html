<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER CONTRA 3D</title>
    <link rel="stylesheet" href="./css/style.css">
    <script>
        window.addEventListener('error', function(e) {
            var box = document.getElementById('mobile-debug');
            if (!box) return;
            box.style.display = 'block';
            if (e.message) {
                var file = e.filename ? e.filename.split('/').pop() : 'script';
                box.innerText += 'ОШИБКА [' + file + ':' + e.lineno + ']: ' + e.message + '\n';
            }
        }, true);
    </script>
</head>
<body>

    <div id="mobile-debug"></div>

    <div id="hud">
        <div class="hud-box">
            <div class="lives" id="lives-display">HP: ♥ ♥ ♥ ♥ ♥</div>
            <div class="weapon-badge" id="weapon-display">ОРУЖИЕ: RIFLE [АВТО]</div>
        </div>
        <div class="hud-box right">
            <div class="score" id="score-display">SCORE: 00000</div>
            <div class="weapon-badge" id="music-status">SYNTH: ON</div>
        </div>
    </div>

    <div id="boss-bar-container">
        <div id="boss-bar-label">ЯДРО БАЗЫ ОМЕГА</div>
        <div id="boss-bar"></div>
    </div>

    <div id="touch-controls">
        <div class="dpad">
            <div class="t-btn up" data-key="ArrowUp">▲</div>
            <div class="t-btn left" data-key="ArrowLeft">◀</div>
            <div class="t-btn right" data-key="ArrowRight">▶</div>
            <div class="t-btn down" data-key="ArrowDown">▼</div>
        </div>
        <div class="action-btns">
            <div class="t-btn fire" data-key="KeyJ">ОГОНЬ</div>
            <div class="t-btn jump" data-key="Space">ПРЫЖОК</div>
        </div>
    </div>

    <div id="overlay">
        <h1 id="overlay-title">CYBER CONTRA 3D</h1>
        <div class="subtitle" id="overlay-sub">MOBILE + PC EDITION</div>
        <div class="controls-card">
            <div>Поверни телефон горизонтально и жми старт!</div>
            <div>На ПК: <span class="key">WASD</span> + <span class="key">SPACE</span> + <span class="key">J</span></div>
        </div>
        <button id="start-btn">НАЧАТЬ ШТУРМ</button>
    </div>

    <script>
        (function() {
            var cdnList = [
                'https://' + 'cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
                'https://' + '://unpkg.com'
            ];
            function loadThree(idx) {
                if (idx >= cdnList.length) return;
                var s = document.createElement('script');
                s.src = cdnList[idx];
                s.onload = function() {
                    var m = document.createElement('script');
                    m.type = 'module';
                    m.src = './js/main.js?v=' + Date.now();
                    document.body.appendChild(m);
                };
                s.onerror = function() { loadThree(idx + 1); };
                document.head.appendChild(s);
            }
            loadThree(0);
        })();
    </script>
</body>
</html>
